    <pattern id="pins" width="18" height="12" patternUnits="userSpaceOnUse"><rect x="2" width="9" height="12" fill="#afbdc8"/></pattern>
  </defs>
  <rect width="720" height="320" fill="#e1efed"/>
  <path d="M0 60 L410 0H526L215 320H0Z" fill="#c3ddd8"/>
